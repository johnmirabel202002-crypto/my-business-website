<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail'e Press-On Nails - Coming Soon</title>
  <style>
    /* Base Reset & Fonts */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Playfair Display', Georgia, serif;
      background-color: #8C7B73; /* Neutral taupe background */
      color: #F7E7E5; /* Soft blush text */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      padding: 40px 20px;
    }

    /* Header & Titles */
    .brand-title {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #FCD8D4;
    }
    .subtitle {
      font-family: sans-serif;
      font-size: 0.85rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: 5px;
      opacity: 0.9;
    }
    .divider {
      margin: 20px auto;
      width: 120px;
      border-bottom: 1px solid #FCD8D4;
      position: relative;
    }

    .coming-soon {
      font-family: 'Dancing Script', cursive, serif;
      font-size: 3rem;
      font-style: italic;
      color: #FCD8D4;
      margin: 25px 0;
    }

    /* Benefits Grid */
    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 35px 0;
      border-top: 1px solid rgba(253, 216, 212, 0.3);
      border-bottom: 1px solid rgba(253, 216, 212, 0.3);
      padding: 20px 0;
    }
    .feature-item {
      font-family: sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .feature-item span {
      display: block;
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    /* Contacts Section */
    .contacts {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 30px;
      font-family: sans-serif;
      font-size: 0.9rem;
    }
    .contact-link {
      color: #FFF;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Brand Title -->
    <h1 class="brand-title">Nail’e</h1>
    <p class="subtitle">Press-On Nails</p>
    
    <div class="divider"></div>

    <!-- Status -->
    <h2 class="coming-soon">Coming Soon</h2>

    <!-- Features Section -->
    <div class="features">
      <div class="feature-item">
        <span>💎</span>
        <p>Trendy<br>Designs</p>
      </div>
      <div class="feature-item">
        <span>♡</span>
        <p>Easy To<br>Apply</p>
      </div>
      <div class="feature-item">
        <span>✨</span>
        <p>Reusable<br>& Durable</p>
      </div>
      <div class="feature-item">
        <span>👑</span>
        <p>Premium<br>Quality</p>
      </div>
    </div>

    <!-- Social / Contact Links -->
    <div class="contacts">
      <a class="contact-link" href="https://wa.me/2348146803668" target="_blank">
        WhatsApp: +234 814 680 3668
      </a>
      <span>|</span>
      <a class="contact-link" href="https://snapchat.com/add/mirabeljohn26" target="_blank">
        Snap: @mirabeljohn26
      </a>
    </div>
  </div>

</body>
</html>
